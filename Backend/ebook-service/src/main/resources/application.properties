# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=8088
spring.application.name=EBOOK-SERVICE

# ============================================================
# MYSQL DATABASE CONFIGURATION
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/booknest_ebook?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# Hibernate will create/update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ============================================================
# EUREKA SERVICE DISCOVERY
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=10

# ============================================================
# CLOUDINARY — Cloud Image & PDF Storage
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dummy}
cloudinary.api-key=${CLOUDINARY_API_KEY:dummy}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dummy}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
# SPRING BOOT ADMIN CLIENT
# ============================================================
spring.boot.admin.client.url=http://localhost:9090
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin123
spring.boot.admin.client.instance.name=EBOOK-SERVICE

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ============================================================
# GATEWAY SECRET
gateway.secret=${GATEWAY_SECRET:booknest-gateway-secret-key-12345}

# LOCAL UPLOADS
app.upload-dir=${APP_UPLOAD_DIR:./uploads}
